<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AS Roma 26/27 · 比赛数据中心（预览版）</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#050810;color:#fff;font-family:Inter,system-ui,sans-serif;font-size:13px;min-height:100vh}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:99;background:repeating-linear-gradient(0deg,rgba(255,255,255,.014) 0 1px,transparent 1px 3px)}
.font-data{font-family:'JetBrains Mono',ui-monospace,monospace}
.display-label{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#4a5568;font-weight:500}
aside{position:fixed;inset:0 auto 0 0;width:240px;background:#070b16;border-right:1px solid #131c33;display:flex;flex-direction:column;z-index:40}
.brand{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid #131c33}
.crest{width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f0bc42,#b8860b 60%,#7a5c08);display:flex;align-items:center;justify-content:center;font-weight:800;color:#3a2c00;font-size:13px;border:2px solid #F0BC42}
.navbtn{display:flex;align-items:center;justify-content:center;position:relative;width:calc(100% - 24px);margin:0 12px;padding:10px 12px;border-radius:2px;border:1px solid transparent;background:none;color:#8b96ad;font-size:13px;cursor:pointer;text-align:center;white-space:nowrap;transition:all .15s}
.navbtn:hover{background:#0c1220;color:#fff}
.navbtn.on{background:#0c1220;border-color:#1a2540;color:#fff}
.navbtn.on .nico{color:#34d399}
.navbtn .dot{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:6px;height:6px;border-radius:50%;background:#34d399}
.rosterbtn{display:flex;align-items:center;gap:10px;width:calc(100% - 24px);margin:0 12px;padding:8px 10px;border-radius:2px;border:1px solid transparent;background:none;cursor:pointer;text-align:left;transition:all .15s}
.rosterbtn:hover{border-color:#1a2540;background:#0c1220}
.rosterbtn:hover .rno{color:#22d3ee}
.rosterbtn:hover .rname{color:#fff}
.rno{font-family:'JetBrains Mono';width:26px;text-align:center;font-size:12px;font-weight:700;color:#4a5568}
.rname{flex:1;truncate;font-size:12.5px;color:#b7bfd0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{margin-left:240px}
header{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:rgba(5,8,16,.9);backdrop-filter:blur(6px);border-bottom:1px solid #131c33}
#view{padding:16px 24px 80px}
.panel{background:#0c1220;border:1px solid #1a2540;border-radius:2px;margin-bottom:16px}
.phead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid #131c33;flex-wrap:wrap}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
th{text-align:left}
.trow td{transition:background .15s}
.trow:hover td{background:#111a2b}
.score{display:inline-block;width:76px;padding:10px 6px;background:#070b16;border:1px solid transparent;border-radius:2px;text-align:center;font-family:'JetBrains Mono';font-weight:700;font-size:14px;cursor:pointer;transition:border-color .15s}
.score:hover{border-color:#2a3a5f}
.scoreInput{width:76px;padding:10px 6px;background:#050810;border:1px solid rgba(52,211,153,.6);border-radius:2px;text-align:center;font-family:'JetBrains Mono';font-weight:700;font-size:14px;color:#fff;outline:none}
.avg{color:#fff;font-weight:700;font-family:'JetBrains Mono'}
.inp,select.inp,textarea.inp{width:100%;background:#050810;border:1px solid #1a2540;border-radius:2px;color:#fff;padding:8px 10px;font-size:12.5px;font-family:inherit;outline:none}
.inp:focus{border-color:#2a3a5f}
.fld label{display:block;font-size:10.5px;color:#4a5568;margin-bottom:6px;letter-spacing:.08em}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:2px;padding:8px 14px;font-family:'JetBrains Mono';font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;border:1px solid rgba(52,211,153,.5);background:rgba(52,211,153,.08);color:#34d399;transition:background .15s}
.btn:hover{background:rgba(52,211,153,.14)}
.btn.solid{background:#34d399;color:#050810;border-color:#34d399}
.btn.solid:hover{opacity:.9}
.btn.danger{border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.08);color:#f87171}
.pchip{display:inline-flex;align-items:center;border:1px solid #1a2540;border-radius:2px;background:#070b16;color:#b7bfd0;padding:6px 10px;font-size:12px;cursor:pointer;font-family:inherit;transition:all .15s}
.pchip:hover{border-color:#2a3a5f;color:#fff}
.pchip.on{border-color:rgba(52,211,153,.55);background:rgba(52,211,153,.1);color:#34d399}
.chip{border:1px solid #1a2540;border-radius:2px;background:none;color:#8b96ad;padding:6px 12px;font-size:11.5px;cursor:pointer;transition:all .15s}
.chip:hover{border-color:#2a3a5f;color:#fff}
.chip.on{border-color:rgba(52,211,153,.5);background:rgba(52,211,153,.1);color:#34d399}
.badge{display:inline-block;padding:2px 7px;border-radius:2px;font-size:10px;font-weight:700}
.badge.win{background:rgba(52,211,153,.12);color:#34d399}
.badge.draw{background:rgba(139,150,173,.12);color:#8b96ad}
.badge.loss{background:rgba(248,113,113,.12);color:#f87171}
.posbadge{display:inline-block;padding:2px 7px;border-radius:2px;font-size:10px;border:1px solid #1a2540;color:#8b96ad}
.pcard{background:#0c1220;border:1px solid #1a2540;border-radius:2px;padding:14px 16px;transition:border-color .15s}
.pcard:hover{border-color:#2a3a5f}
.pcard.focus{border-color:rgba(240,188,66,.5)}
.pnum{font-family:'JetBrains Mono';font-size:20px;font-weight:700;color:#4a5568}
.pstat{display:flex;flex-direction:column;gap:2px}
.pstat .v{font-family:'JetBrains Mono';font-size:15px;font-weight:700;color:#fff}
.pstat .k{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#4a5568}
.mini{display:flex;flex-direction:column;gap:2px;padding:10px 12px;background:#070b16;border:1px solid #131c33;border-radius:2px}
.mini .v{font-family:'JetBrains Mono';font-size:14px;font-weight:700;white-space:nowrap}
.mini .k{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#4a5568}
#toast{position:fixed;right:20px;bottom:20px;z-index:100;background:#0c1220;border:1px solid #1a2540;border-radius:2px;color:#fff;font-size:12.5px;padding:12px 16px;display:none;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.numbadge{display:inline-block;min-width:22px;padding:1px 4px;margin-right:9px;border:1px solid #1a2540;border-radius:2px;background:#070b16;text-align:center;font-family:'JetBrains Mono';font-size:10.5px;font-weight:700;color:#8b96ad;vertical-align:middle}
.dditem{display:flex;align-items:center;width:100%;padding:8px 14px;background:none;border:none;font-size:12.5px;cursor:pointer;text-align:left;font-family:inherit}
.dditem:hover{background:#111a2b}
.suggest-wrap{position:relative}
.suggest-btn{position:absolute;right:1px;top:1px;bottom:1px;width:30px;background:#0c1220;border:none;border-left:1px solid #1a2540;color:#4a5568;cursor:pointer;font-size:11px;border-radius:0 2px 2px 0}
.suggest-btn:hover{color:#fff;background:#111a2b}
.suggest-box{display:none;position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:50;max-height:220px;overflow-y:auto;background:#0c1220;border:1px solid #1a2540;border-radius:2px;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.sugitem{padding:8px 12px;font-size:12.5px;color:#b7bfd0;cursor:pointer}
.sugitem:hover{background:#111a2b;color:#fff}
.expbtn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border:1px solid #1a2540;border-radius:2px;background:#070b16;color:#8b96ad;font-size:14px;transition:all .15s}
.matchtable .trow:hover .expbtn{border-color:rgba(240,188,66,.5);color:#F0BC42}
.expbtn.open{border-color:rgba(240,188,66,.6);background:rgba(240,188,66,.12);color:#F0BC42}
.hometag{display:inline-block;margin-left:9px;padding:1px 7px;border-radius:2px;font-size:10px;border:1px solid;vertical-align:middle}
.hometag.home{border-color:rgba(52,211,153,.45);color:#34d399}
.hometag.away{border-color:rgba(139,150,173,.45);color:#8b96ad}
.subtable{width:100%;border-collapse:collapse;font-size:12.5px}
.subtable th{padding:9px 14px;text-align:left}
.subtable td{padding:9px 14px;border-top:1px solid #101828}
.subtable .trow td{background:transparent;transition:background .15s}
.subtable .trow:hover td{background:#0d1524}
.readonly [data-admin-btn]{opacity:.35!important;cursor:not-allowed!important}
.readonly [data-admin-btn].score{opacity:1!important;cursor:pointer}
#tip{position:fixed;z-index:200;display:none;background:#0c1220;border:1px solid #1a2540;border-radius:2px;padding:10px 14px;font-size:12px;box-shadow:0 12px 40px rgba(0,0,0,.65);pointer-events:none;min-width:160px}
.whitespace-nowrap{white-space:nowrap}
.matchtable{border-spacing:0 3px;font-size:12.5px}
.matchtable th{padding:12px 16px;font-size:11px}
.matchtable td{padding:11px 14px;background:#0a1120}
.matchtable td:first-child{border-radius:2px 0 0 2px}
.matchtable td:last-child{border-radius:0 2px 2px 0}
.matchtable .trow:hover td{background:#131d31}
input[type="date"]{color-scheme:dark}
input[type="date"]::-webkit-calendar-picker-indicator{cursor:pointer;opacity:.85}
input[type="date"]::-webkit-calendar-picker-indicator:hover{opacity:1}
.note{padding:12px 16px;color:#4a5568;font-size:11px}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:60px 20px;color:#8b96ad;font-size:13px;text-align:center}
footer.note{border-top:1px solid #131c33;padding:12px 20px;font-family:'JetBrains Mono';font-size:10px;color:#4a5568;letter-spacing:.15em}
.selwrap select{max-width:280px}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
select option{background:#0c1220;color:#fff}
@media(max-width:820px){aside{display:none}main{margin-left:0}}
</style>
</head>

function perfBase(r){return 6.2+r.goals*1.15+r.assists*0.8+r.keyPasses*0.12+(r.passAccuracy-85)*0.03+r.shotsOnTarget*0.15+(r.tackles+r.interceptions)*0.08}
function seedRecords(){return SEED_ROWS.map((b,i)=>{
 const[mIdx,pid,minutes,goals,assists,shots,sot,kp,passes,pa,tackles,inter,fouls,yc,rc]=b;
 const m=SEED_MATCHES[mIdx];
 const legacy=mIdx<=3; /* 旧数据带赛后自评，新数据没有 */
 const base=perfBase({goals,assists,keyPasses:kp,passAccuracy:pa,shotsOnTarget:sot,tackles,interceptions:inter});
 return{id:'seed-'+i,playerId:pid,date:m.date,opponent:m.opp,competition:m.comp,homeAway:m.ha,teamScore:m.ts,opponentScore:m.os,minutes,goals,assists,shots,shotsOnTarget:sot,keyPasses:kp,passes,passAccuracy:pa,tackles,interceptions:inter,fouls,yellowCards:yc,redCards:rc,rating:legacy?round1(clamp(base,5.5,9.8)):undefined};
})}

 {id:'o-whoscored',name:'WhoScored'},{id:'o-sofascore',name:'SofaScore'},{id:'o-dqd',name:'懂球帝'},{id:'o-hupu',name:'虎扑足球'},
]}
function seedRatings(records,outlets){
 const bias={'o-whoscored':0.1,'o-sofascore':0.05,'o-dqd':-0.15,'o-hupu':-0.05};
 const out=[];
 records.forEach((r,ri)=>{
  const base=perfBase(r);
  outlets.forEach((o,oi)=>{
   const pseudo=Math.abs(Math.sin(ri*37.13+oi*91.7)*10000)%1;
   const score=round1(clamp(base+(bias[o.id]??0)+(pseudo-0.5)*0.9,4,9.9));
   out.push({id:'sr-'+r.id+'-'+o.id,recordId:r.id,outletId:o.id,score});
  });
 });
 return out;
}

}
async function authLogin(){
 const email=$('auEmail').value.trim(),pw=$('auPw').value;
 if(!email||!pw)return toast('请填写邮箱和密码');
 const {data,error}=await sb.auth.signInWithPassword({email,password:pw});
 if(error)return toast('登录失败：'+error.message);
 session=data.session;
 const {data:w}=await sb.from('admin_whitelist').select('email');whitelist=(w||[]).map(x=>x.email);
 state.authOpen=false;
 toast(editable()?'登录成功，已获得编辑权限':'登录成功，但你的邮箱不在管理员白名单中（只读）');
 render();
}
async function authLogout(){
 if(sb)await sb.auth.signOut();
 session=null;whitelist=[];
 toast('已退出登录');
 render();
}
window.tipShow=function(px,py,d){const t=$('tip');let scoreBlock;
 if(d.all){const items=d.all.split(';').filter(Boolean).map(pair=>{const i=pair.lastIndexOf(':');return{n:pair.slice(0,i),v:pair.slice(i+1)}});
  scoreBlock=`<div style="display:grid;grid-template-columns:auto auto;gap:3px 12px;margin:6px 0 8px;align-items:baseline">${items.map(x=>`<span style="font-size:11px;color:#8b96ad">${esc(x.n)}</span><span class="font-data" style="font-size:12.5px;font-weight:700;color:#b7bfd0;text-align:right">${(+x.v).toFixed(1)}</span>`).join('')}<span style="font-size:11px;color:#F0BC42;font-weight:700">均分</span><span class="font-data" style="font-size:13px;font-weight:700;color:#F0BC42;text-align:right">${(+d.v).toFixed(2)}</span></div>`;
 }else{scoreBlock=`<div class="font-data" style="font-size:17px;font-weight:700;color:#F0BC42;margin:6px 0">${(+d.v).toFixed(d.out==='均分'?2:1)}</div>`}
 t.innerHTML=`<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:2px"><span style="font-weight:700">${esc(d.p)}</span><span style="color:#4a5568;font-size:11px">${esc(d.out)}</span></div>${scoreBlock}<div style="color:#8b96ad;font-size:11.5px;line-height:1.8">${d.d} · ${d.ha} vs ${esc(d.o)}<br/>比分 <span class="font-data" style="color:#b7bfd0">${d.s}</span></div>`;t.style.display='block';const w=t.offsetWidth,h=t.offsetHeight;let lx=px+14,ly=py+14;if(lx+w>innerWidth-10)lx=px-w-14;if(ly+h>innerHeight-10)ly=py-h-14;t.style.left=lx+'px';t.style.top=ly+'px'};
window.tipHide=function(){const t=$('tip');if(t)t.style.display='none'};
document.addEventListener('mouseover',e=>{const c=e.target&&e.target.closest?e.target.closest('circle[data-tip]'):null;if(c)tipShow(e.clientX,e.clientY,c.dataset)});
document.addEventListener('mouseout',e=>{const c=e.target&&e.target.closest?e.target.closest('circle[data-tip]'):null;if(c)tipHide()});
document.addEventListener('scroll',()=>tipHide(),true);
document.addEventListener('click',e=>{
 if(editable())return;
 const t=e.target&&e.target.closest?e.target.closest('[data-admin-btn]'):null;
 if(t){e.preventDefault();e.stopPropagation();toast('该功能需要管理员权限')}
},true);
initCloud().finally(()=>render());
</script>
